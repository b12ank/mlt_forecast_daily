stage: stage4
seed: 42
threads: 4
strategies: [shared, independent]
grids:
  ridge:
    - {alpha: 0.1}
    - {alpha: 1.0}
    - {alpha: 10.0}
    - {alpha: 100.0}
  catboost:
    - {depth: 4, iterations: 300, learning_rate: 0.05, loss_function: RMSE}
    - {depth: 4, iterations: 300, learning_rate: 0.05, loss_function: MAE}
    - {depth: 6, iterations: 300, learning_rate: 0.05, loss_function: RMSE}
    - {depth: 6, iterations: 300, learning_rate: 0.05, loss_function: MAE}
  lightgbm:
    - {max_depth: 6, num_leaves: 15, min_child_samples: 30, n_estimators: 300, learning_rate: 0.05, objective: regression}
    - {max_depth: 6, num_leaves: 15, min_child_samples: 30, n_estimators: 300, learning_rate: 0.05, objective: regression_l1}
    - {max_depth: 6, num_leaves: 31, min_child_samples: 30, n_estimators: 300, learning_rate: 0.05, objective: regression}
    - {max_depth: 6, num_leaves: 31, min_child_samples: 30, n_estimators: 300, learning_rate: 0.05, objective: regression_l1}
