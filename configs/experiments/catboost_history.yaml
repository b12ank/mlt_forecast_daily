data:
  daily: 电价数据/shandong_pmos_daily.csv
  hourly: 电价数据/shandong_pmos_hourly.csv
  encoding: gb18030
  mean_tolerance: 0.001
  snapshot_origin: '2026-10-25'
task:
  horizons:
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  timezone: Asia/Shanghai
features:
  groups:
  - price_calendar
  - weather_full_no_missing
model:
  name: catboost
  strategy: shared
  seed: 42
  threads: 4
  params:
    depth: 5
    iterations: 300
    learning_rate: 0.05
    loss_function: RMSE
weather:
  weather_source: history  # history 或 forecast，仅控制回测推理
  history: develop/data/weather_data_daily.csv
  forecast: develop/data/weather_data_daily_predict.csv
  match_origins: true
backtest:
  training_target_start: '2022-01-01'
  test:
  - '2026-09-25'
  - '2026-10-24'
  window: expanding
  retrain_days: 1
evaluation:
  protocol: evaluation_v1
  equal_tolerance: 1.0e-08
