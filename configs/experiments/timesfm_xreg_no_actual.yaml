data:
  daily: 电价数据/shandong_pmos_daily.csv
  hourly: 电价数据/shandong_pmos_hourly.csv
  encoding: gb18030
  mean_tolerance: 0.001
  snapshot_origin: '2026-10-25'
task:
  horizons:
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  timezone: Asia/Shanghai
features:
  groups:
  - price_history
  - xreg_dayahead
  - xreg_grid_forecast
  - weather_full
  - xreg_calendar
model:
  name: timesfm_xreg
  strategy: independent
  seed: 42
  threads: 4
  params:
    context_length: 512
    checkpoint_dir: E:/pycharmproject/epf/models/timesFM
    ridge: 0.01
weather:
  weather_source: history
  history: develop/data/weather_data_daily.csv
  forecast: develop/data/weather_data_daily_predict.csv
  match_origins: true
backtest:
  training_target_start: '2022-01-01'
  test:
  - '2026-09-25'
  - '2026-10-24'
  window: expanding
  retrain_days: 1
evaluation:
  protocol: evaluation_v1
  equal_tolerance: 1.0e-08
